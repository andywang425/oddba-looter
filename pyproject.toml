[project]
name = "oddba-looter"
version = "0.1.0"
description = "ODDBA 中文社区每日签到，签到宝箱奖励 / 每日任务奖励自动领取脚本"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "curl-cffi>=0.16.3,<1.0",
    "python-dotenv>=1.2.3,<2.0",
    "loguru~=0.7.3",
]

[project.scripts]
oddba-looter = "oddba_looter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oddba_looter"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = ["ruff>=0.16.8"]
